[server]
bind_address = "0.0.0.0"
host_port = 3000

[search]
provider = "searxng"
searxng_url = "http://mcp-server:8080"

[renderer]
mode = "lightpanda"

[renderer.lightpanda]
ws_url = "ws://lightpanda:9222/"

[rate_limit]
enabled = true
max_requests_per_minute = 60

[auth]
enabled = false

[llm]
enabled = true
provider = "openai-compatible"
base_url = "http://host.docker.internal:7354/v1"
api_key = "sk-dummy"
model = "auto-fastest"
max_tokens = 4096

[extraction]
default_format = "markdown"
only_main_content = true

[extraction.llm_fallback]
enable = true
quality_threshold = 0.3
max_html_bytes = 50000
always_run = true

[cache]
max_size_mb = 200
ttl_seconds = 300
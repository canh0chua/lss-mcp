version: '3.8'

services:
  searxng:
    image: searxng/searxng:latest
    container_name: lss-mcp_searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng-data:/etc/searxng:rw
      - ./logs/searxng:/var/log/searxng
      - ./certs:/usr/local/share/ca-certificates/custom:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_URL_FORMAT=json
      - SEARXNG_LIMITER=false
      - SEARXNG_PUBLIC_INSTANCE=false
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
    command: ["/bin/sh", "-c", "update-ca-certificates 2>/dev/null; /usr/local/searxng/dockerfiles/docker-entrypoint.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz').read().decode()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mcp-server:
    build: .
    container_name: lss-mcp_support_server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${WORKSPACE_PATH:-/tmp/lss-mcp-workspace}:/workspace
      - ./logs/mcp-server:/var/log/mcp-server
    environment:
      - SEARXNG_URL=http://host.docker.internal:8080
      - WORKSPACE=/workspace
      - WORKSPACE_PROJECT=${WORKSPACE_PROJECT:-}
    stdin_open: true
    tty: false
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

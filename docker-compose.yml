version: '3.8'

services:
  searxng:
    image: searxng/searxng:latest
    container_name: lss-mcp_searxng
    volumes:
      - ./searxng-data:/etc/searxng
      - ./logs/searxng:/var/log/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_URL_FORMAT=json
      - SEARXNG_LIMITER=false
      - SEARXNG_PUBLIC_INSTANCE=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz').read().decode()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mcp-server:
    build: .
    container_name: lss-mcp_support_server
    network_mode: service:searxng
    volumes:
      - ./workspace:/workspace
      - ./logs/mcp-server:/var/log/mcp-server
    environment:
      - SEARXNG_URL=http://localhost:8080
      - WORKSPACE=/workspace
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

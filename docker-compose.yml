version: '3.8'

services:

  lightpanda:
    image: lightpanda/browser:latest
    container_name: lss-mcp_lightpanda
    restart: unless-stopped
    environment:
      - LIGHTPANDA_DISABLE_TELEMETRY=true
      - LIGHTPANDA_HOST=0.0.0.0
      - LIGHTPANDA_ADVERTISE_HOST=lightpanda
    mem_limit: 1g
    memswap_limit: 1g
    command: ["/bin/lightpanda", "serve", "--host", "0.0.0.0", "--port", "9222", "--advertise-host", "lightpanda"]

    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9222"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  crw:
    image: ghcr.io/us/crw:latest
    container_name: lss-mcp_crw
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - RUST_LOG=info
      - CRW_BIND_ADDRESS=0.0.0.0
      - CRW_HOST_PORT=3000
      - CRW_SEARCH__PROVIDER=searxng
      - CRW_SEARCH__SEARXNG_URL=http://mcp-server:8081
      - CRW_RENDERER__MODE=lightpanda
      - CRW_RENDERER__LIGHTPANDA__WS_URL=ws://lightpanda:9222/
      - CRW_RENDERER__CHROME__WS_URL=ws://localhost:9222/
    volumes:
      - ./config.toml:/app/config.toml:ro
    mem_limit: 1g
    memswap_limit: 1g
    depends_on:
      lightpanda:
        condition: service_started
    cap_add:
      - SYS_NICE
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mcp-server:
    build: .
    container_name: lss-mcp_support_server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3003:8081"
      - "127.0.0.1:3004:8080"
    volumes:
      - ${WORKSPACE_PATH:-/tmp/lss-mcp-workspace}:/workspace
      - ./logs/mcp-server:/var/log/mcp-server
    environment:
      - WORKSPACE=/workspace
      - WORKSPACE_PATH=${WORKSPACE_PATH:-/tmp/lss-mcp-workspace}
      - WORKSPACE_PROJECT=${WORKSPACE_PROJECT:-}
      - FIRECRAWL_API_URL=http://crw:3000
      - GATEWAY_BIND=0.0.0.0:8081
    stdin_open: true
    tty: false
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      crw:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ["CMD", "echo", "ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  lightpanda-mcp:
    image: lightpanda/browser:latest
    container_name: lss-mcp_lightpanda_mcp
    command: ["/bin/lightpanda", "mcp"]
    stdin_open: true
    tty: true
    ports: []  # No ports; MCP uses stdio
    depends_on:
      - mcp-server
    networks:
      - default
